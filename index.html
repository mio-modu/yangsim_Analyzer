<style>
/* 레이아웃: 한 줄기로 내려가는 단일 컬럼. 모든 것이 가운데에 선다. */
:root{
  --void:#07090B;          /* 바탕 */
  --panel:#0E1216;         /* 카드 */
  --panel-2:#151B21;       /* 선택지 */
  --edge:#1E272F;          /* 경계선 */
  --ink:#E8EDF2;           /* 본문 */
  --ink-dim:#8A99A6;       /* 보조 */
  --ink-faint:#7A8894;     /* 흐림 */
  --warm:#E0A93B;          /* HCQ 축 — 따뜻함 */
  --rare:#8E7BF5;          /* RQ 축 — 희귀함 */
  --rare-lit:#A99AF8;
  --serif:'Nanum Myeongjo', Georgia, serif;
  --sans:'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);
  font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;text-align:center;
  padding-left:max(20px, env(safe-area-inset-left, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-block:0 72px;
}
.wrap{max-width:520px;margin:0 auto}

/* ── 머리 ── */
header{padding-block:56px 34px;transition:padding .3s ease}
body.go header{padding-block:30px 20px}
body.go h1{font-size:clamp(17px,4.4vw,20px);margin:10px 0 0;font-weight:700;color:var(--ink-dim)}
body.go .lede,body.go .counter{display:none}
.mark{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--ink-faint);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(28px,7.6vw,40px);line-height:1.2;
  margin:16px 0 12px;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--ink-dim);font-size:14px;max-width:24em;margin:0 auto;text-wrap:balance}
.counter{display:inline-flex;align-items:baseline;gap:7px;margin-top:22px;
  font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
.counter b{color:var(--warm);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* ── 진행 ── */
.rail{display:flex;gap:5px;margin:0 auto 26px;max-width:220px}
.rail i{flex:1;height:2px;background:var(--edge);transition:background .4s ease}
.rail i.on{background:var(--warm)}

/* ── 질문 ── */
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--warm);
  text-transform:uppercase;margin-bottom:18px}
.q{font-family:var(--serif);font-size:clamp(19px,4.8vw,24px);line-height:1.65;font-weight:400;
  margin:0 auto 32px;max-width:19em;text-wrap:balance}
.chosen{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--warm);
  margin:0 auto 18px;max-width:22em;line-height:1.6}
.q.why{font-size:clamp(18px,4.4vw,21px);margin-bottom:26px}
.opts{display:flex;flex-direction:column;gap:9px;max-width:420px;margin:0 auto}
.opt{display:block;width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:2px;
  padding:17px 18px;color:var(--ink);font-family:var(--sans);font-size:15px;font-weight:400;
  line-height:1.55;text-align:center;cursor:pointer;transition:border-color .16s ease, background .16s ease}
.opt:hover{border-color:var(--warm);background:var(--panel-2)}
.opt:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.opt .sub{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-faint);
  letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.opt.reason{font-size:14.5px;padding:15px 18px}
.back{margin-top:24px;background:none;border:none;color:var(--ink-faint);font-family:var(--mono);
  font-size:11px;cursor:pointer;padding:8px 14px;letter-spacing:.06em}
.back:hover{color:var(--ink-dim)}

/* ── 결과 ── */
.res{display:flex;flex-direction:column;align-items:center;gap:0}
.en{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase}
.ko{font-family:var(--serif);font-weight:800;font-size:clamp(40px,11.5vw,58px);margin:12px 0 18px;
  color:var(--warm);line-height:1.12;letter-spacing:.02em;text-wrap:balance}
.line{color:var(--ink-dim);font-size:14.5px;max-width:21em;margin:0 auto;text-wrap:balance}

.axes{display:flex;justify-content:center;gap:52px;margin:40px auto 0}
.ax .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase}
.ax .v{font-family:var(--mono);font-size:clamp(44px,13vw,58px);font-weight:700;line-height:1.05;
  margin-top:6px;font-variant-numeric:tabular-nums}
.ax.warm .v{color:var(--warm)} .ax.rare .v{color:var(--rare-lit)}

canvas#cv{width:100%;max-width:400px;height:auto;display:block;margin:40px auto 0}

.rare-line{margin:40px auto 0;max-width:22em}
.rare-line .big{font-family:var(--serif);font-size:clamp(20px,5.2vw,25px);font-weight:700;
  color:var(--rare-lit);line-height:1.45;text-wrap:balance}
.rare-line .sm{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:12px;letter-spacing:.05em}
.rare-line .sm2{font-size:13.5px;color:var(--ink-dim);margin-top:18px;line-height:1.7;text-wrap:balance}
.waiting{margin:40px auto 0;max-width:20em;font-size:13.5px;color:var(--ink-dim);line-height:1.7}

.acts{display:flex;flex-direction:column;gap:9px;max-width:420px;width:100%;margin:44px auto 0}
.btn{display:block;width:100%;padding:16px;border-radius:2px;font-family:var(--sans);
  font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--edge);
  background:var(--panel);color:var(--ink);transition:border-color .16s ease}
.btn:hover{border-color:var(--warm)}
.btn.primary{background:var(--warm);color:#140D02;border-color:var(--warm);font-weight:700}
.btn.primary:hover{background:#EFBE52}
.btn:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:default}
.ghost{margin-top:4px;background:none;border:none;color:var(--ink-faint);font-family:var(--mono);
  font-size:11px;cursor:pointer;padding:10px;letter-spacing:.05em}
.ghost:hover{color:var(--ink-dim)}

.foot{margin:52px auto 0;max-width:23em;padding-top:30px;border-top:1px solid var(--edge)}
.foot p{font-family:var(--serif);font-size:14.5px;color:var(--ink-dim);margin:0;line-height:1.85;text-wrap:balance}
.foot .p2{margin-top:18px;color:var(--ink-faint);font-size:13.5px}
.foot .fine{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:18px;letter-spacing:.14em}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%) translateY(140%);visibility:hidden;opacity:0;pointer-events:none;
  background:var(--panel-2);border:1px solid var(--edge);padding:12px 20px;border-radius:2px;
  font-family:var(--mono);font-size:11.5px;transition:transform .3s ease, opacity .3s ease, visibility .3s;z-index:20}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible;opacity:1}

.warn{margin:34px auto 0;max-width:23em;padding:16px 18px;border:1px solid #6B3A2E;
  background:#1A0F0B;border-radius:3px;font-size:13px;line-height:1.7;color:#E0B3A4}
.warn b{color:#F0C4B5;font-weight:500}

@media (prefers-reduced-motion: reduce){*{transition-duration:.001ms !important;animation-duration:.001ms !important}}

<body>

<div class="wrap">
  <header>
    <div class="mark">Conscience Coordinates</div>
    <h1>당신의 양심은<br>어디에 있습니까</h1>
    <p class="lede">다섯 개의 답 없는 질문. 정답을 채점하지 않습니다. 당신이 어디에 서 있는지만 기록합니다.</p>
    <div class="counter">지금까지 <b id="nCount">—</b> 명이 기록을 남겼습니다</div>
  </header>

  <div id="stage"></div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ============================================================
   양심 좌표 (Conscience Coordinates)
   ------------------------------------------------------------
   2단 응답: 무엇을 택했는가 → 왜 택했는가.
   '왜'가 이 기록의 값어치다. 판단만으로는 데이터가 되지 않는다.

   HCQ(따뜻함) = 고른 '이유'에 부여된 이타성 가중치의 평균. 설계값.
   RQ (희귀함) = 실제 응답자 분포에서 계산. 측정값. N이 클수록 정확해진다.
   둘의 출처가 다르기 때문에 두 축이 서로 독립이다.
   ============================================================ */

/* ── 저장소 ─────────────────────────────────────────────────
   아무것도 안 넣으면 이 브라우저에만 쌓인다(혼자 써보기용).
   SUPABASE에 주소와 anon 키를 넣으면 그때부터 전 세계가 한 통에 쌓인다.
   anon 키는 공개돼도 되는 키다. 단, 테이블 RLS를 insert·select만
   허용하도록 걸어둬야 한다.                                        */
const SUPABASE = {
  url:   'https://geqjbvpliqgrotczepil.supabase.co',
  key:   'sb_publishable_nzIQjN3yFp5sn8Hd011eXg_VbM3Qyqj',   // 공개 키. 코드에 박히는 것이 정상이다.
  table: 'conscience_logs'
};
const LOCAL_KEY = 'conscience_v1';
const live = () => !!(SUPABASE.url && SUPABASE.key);

const Store = {
  /* 한 번의 요청으로 분포와 건수를 모두 받는다.
     ① conscience_stats(mine) 집계 함수 — 기록이 100만 건이어도 응답은 1KB 미만.
     ② 함수가 없으면 전체 경로를 받아 브라우저에서 직접 센다.
        2만 건까지는 이쪽도 괜찮지만, 그 이상이면 방문자마다 누적 기록
        전부를 내려받게 되어 전송량이 제곱으로 불어난다.
     어느 쪽도 응답 헤더를 읽지 않는다. 헤더는 CORS 설정에 따라 가려질 수
     있고, 가려지면 조용히 틀린 값이 나오기 때문이다. */
  async fetchAll(mine){
    if(live()){
      try{
        const r = await fetch(SUPABASE.url+'/rest/v1/rpc/conscience_stats', {
          method:'POST',
          headers:Object.assign(H(),{'Content-Type':'application/json'}),
          body: JSON.stringify({mine: mine || null})
        });
        if(r.ok){
          const j = await r.json();
          if(j && typeof j.n === 'number'){
            const t = this._fromAgg(j);
            /* 방금 넣은 내 기록이 아직 안 보일 수 있다. 내가 답한 건 확실하므로
               최소 1로 둔다. 지어내는 게 아니라 읽기 지연을 바로잡는 것이다. */
            t.twin = mine ? Math.max(1, j.twin|0) : null;
            t.same = mine ? Math.max(1, j.same|0) : null;
            return t;
          }
        }
      }catch(e){}
      try{
        const r = await fetch(SUPABASE.url+'/rest/v1/'+SUPABASE.table+'?select=path', {headers:H()});
        if(r.ok) return this._tally((await r.json()).map(x=>x.path), mine);
      }catch(e){}
    }
    return this._tally(this._read().map(a=>a.path), mine);
  },

  /* 저장 결과를 숨기지 않는다. 조용히 실패하면 며칠 뒤에야 알게 되고,
     그 사이 들어온 사람들의 기록은 되돌릴 수 없다. */
  async save(rec){
    this._push(rec);
    if(!live()) return {ok:false, why:'서버가 연결돼 있지 않습니다'};
    try{
      const r = await fetch(SUPABASE.url+'/rest/v1/'+SUPABASE.table, {
        method:'POST',
        headers:Object.assign(H(),{'Content-Type':'application/json', Prefer:'return=minimal'}),
        body: JSON.stringify([{path:rec.path, hcq:rec.hcq, type:rec.type}])
      });
      if(r.ok) return {ok:true};
      let detail = '';
      try{ const j = await r.json(); detail = j.message || j.hint || j.code || ''; }catch(e){}
      console.error('[양심좌표] 저장 실패', r.status, detail);
      return {ok:false, why:`서버가 ${r.status}로 거절했습니다${detail?' — '+detail:''}`};
    }catch(e){
      console.error('[양심좌표] 저장 실패(연결)', e);
      return {ok:false, why:'서버에 닿지 못했습니다 — 주소나 네트워크를 확인하세요'};
    }
  },

  _read(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]'); }catch(e){ return []; } },
  _push(r){ try{ const a=this._read(); a.push(r);
    localStorage.setItem(LOCAL_KEY, JSON.stringify(a.slice(-5000))); }catch(e){} },

  _blank(){
    return {grp: Q.map(q=>q.o.map(()=>0)),
            rsn: Q.map(q=>q.o.map(o=>o.r.map(()=>0)))};
  },

  /* 집계 함수가 준 {n, q0..q4}. q0 = {"01":12, "10":7, ...} — 두 자리가 '선택지+이유' */
  _fromAgg(j){
    const {grp, rsn} = this._blank();
    Q.forEach((_,i)=>{
      const bk = j['q'+i] || {};
      Object.keys(bk).forEach(k=>{
        const g=+k[0], r=+k[1], c=+bk[k]||0;
        if(grp[i] && grp[i][g]!==undefined) grp[i][g]+=c;
        if(rsn[i] && rsn[i][g] && rsn[i][g][r]!==undefined) rsn[i][g][r]+=c;
      });
    });
    return {n:j.n||0, grp, rsn, twin:null, same:null};
  },

  /* path = "01-10-02-21-13" */
  _tally(paths, mine){
    const {grp, rsn} = this._blank();
    const go = p => String(p).split('-').map(x=>x[0]).join('');
    const mg = mine ? go(mine) : null;
    let twin=0, same=0;
    paths.forEach(p=>{
      String(p||'').split('-').forEach((seg,i)=>{
        const g=+seg[0], r=+seg[1];
        if(grp[i] && grp[i][g]!==undefined) grp[i][g]++;
        if(rsn[i] && rsn[i][g] && rsn[i][g][r]!==undefined) rsn[i][g][r]++;
      });
      if(mine){ if(p===mine) twin++; if(go(p)===mg) same++; }
    });
    return {n:paths.length, grp, rsn,
            twin: mine?Math.max(1,twin):null, same: mine?Math.max(1,same):null};
  }
};
const H = () => ({apikey:SUPABASE.key, Authorization:'Bearer '+SUPABASE.key});

/* ── 질문 ───────────────────────────────────────────────────
   o = 선택지, r = 그 선택을 한 '이유'.  w = 이타성 가중치(0~100).
   w는 정답의 점수가 아니라 축 위의 자리다. 낮다고 나쁜 게 아니다. */
const Q = [
{ tag:'트롤리',
  q:'브레이크가 고장난 열차가 다섯 명을 향해 달립니다. 레버를 당기면 열차는 다른 선로로 가고, 그곳에 있던 한 명이 죽습니다.',
  o:[
    {t:'레버를 당긴다', s:'다섯을 구하고 하나를 잃는다', r:[
      {t:'더 많은 생명을 구하는 쪽이 옳다', w:72},
      {t:'전체 피해가 적은 쪽을 택한다', w:66},
      {t:'누군가는 결정해야 한다', w:60},
      {t:'그 순간엔 그게 맞다고 느꼈다', w:56} ]},
    {t:'아무것도 하지 않는다', s:'하나를 구하고 다섯을 잃는다', r:[
      {t:'내 손으로 누구도 희생시킬 수 없다', w:54},
      {t:'생명의 값을 사람이 저울질할 수 없다', w:62},
      {t:'내가 개입할 일이 아니다', w:40},
      {t:'결정하기엔 너무 괴롭다', w:44} ]} ]},

{ tag:'한정된 자원',

   test:(h)=> h>=64},

   test:()=> true}

/* ── 상태 ── */
const S = {i:0, stage:0, g:null, picks:[], stats:null, saved:null, last:null};
const $ = s => document.querySelector(s);
const stage = $('#stage');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }

/* ── 질문 ── */
function renderQ(){
  const q = Q[S.i];
  const rail = Q.map((_,i)=>`<i class="${i<S.i||(i===S.i&&S.stage===1)?'on':''}"></i>`).join('');
  const body = S.stage===0
    ? `<p class="q">${esc(q.q)}</p>
       <div class="opts">${q.o.map((o,j)=>
         `<button class="opt" data-j="${j}">${esc(o.t)}<span class="sub">${esc(o.s)}</span></button>`).join('')}</div>`
    : `<p class="chosen">${esc(q.o[S.g].t)}</p>
       <p class="q why">왜 그렇게 하시겠습니까?</p>
       <div class="opts">${q.o[S.g].r.map((r,k)=>
         `<button class="opt reason" data-k="${k}">${esc(r.t)}</button>`).join('')}</div>`;
  stage.innerHTML = `
    <div class="rail">${rail}</div>
    <div class="tag">${esc(q.tag)} · ${S.i+1} / ${Q.length}</div>
    ${body}
    ${(S.i>0||S.stage>0)?'<button class="back" id="back">← 이전으로</button>':''}`;

  stage.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      if(S.stage===0){ document.body.classList.add('go'); S.g=+b.dataset.j; S.stage=1; renderQ(); }
      else{
        S.picks[S.i] = [S.g, +b.dataset.k];
        S.i++; S.stage=0; S.g=null;
        S.i<Q.length ? renderQ() : finish();
      }
    };
  });
  const bk=$('#back');
  if(bk) bk.onclick = ()=>{
    if(S.stage===1){ S.stage=0; S.g=null; }
    else { S.i--; S.stage=1; S.g=S.picks[S.i][0]; }
    renderQ();
  };
}

/* ── 계산 ── */
function score(){
  const hcq = Math.round(S.picks.reduce((a,[g,r],i)=> a + Q[i].o[g].r[r].w, 0) / Q.length);
  const st = S.stats || {n:0,grp:[],rsn:[]};
  const N = st.n||0;
  let rq=null, twin=null, sameChoice=null;
  if(N>=30){
    /* 희귀함 = 선택지 희귀도 45% + 이유 희귀도 55%.
       같은 결론이어도 이유가 다르면 다른 자리다. */
    let sum=0;
    S.picks.forEach(([g,r],i)=>{
      const gr=st.grp[i]||[], gt=gr.reduce((a,b)=>a+b,0)||1;
      const rr=(st.rsn[i]||[])[g]||[], rt=rr.reduce((a,b)=>a+b,0)||1;
      sum += 0.45*(1-((gr[g]||0)/gt)) + 0.55*(1-((rr[r]||0)/rt));
    });
    rq = Math.round(sum/Q.length*100);
    twin = st.twin; sameChoice = st.same;
  }
  return {hcq, rq, N, twin, sameChoice, t:TYPES.find(t=>t.test(hcq, rq==null?0:rq))};
}

const path = () => S.picks.map(([g,r])=>`${g}${r}`).join('-');

/* ── 분포 지도 ── */
function drawMap(cv,hcq,rq){
  const dpr=Math.min(devicePixelRatio||1,2), W=cv.clientWidth||320, H=Math.round(W*.72);
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#0A0E12'; c.fillRect(0,0,W,H);
  const pad=34, w=W-pad*2, h=H-pad*2;
  c.strokeStyle='#19222A'; c.lineWidth=1;
  for(let i=0;i<=4;i++){ const x=pad+w*i/4, y=pad+h*i/4;
    c.beginPath(); c.moveTo(x,pad); c.lineTo(x,pad+h); c.stroke();
    c.beginPath(); c.moveTo(pad,y); c.lineTo(pad+w,y); c.stroke(); }
  c.fillStyle='rgba(142,123,245,.10)'; c.fillRect(pad+w*.62, pad, w*.38, h*.40);
  c.font='500 9px ui-monospace, monospace'; c.fillStyle='#9A8CE8';
  c.fillText('ARCHITECTS', pad+w*.64, pad+13);
  c.strokeStyle='#2A3540';
  c.beginPath(); c.moveTo(pad,pad+h); c.lineTo(pad+w,pad+h); c.stroke();
  c.beginPath(); c.moveTo(pad,pad); c.lineTo(pad,pad+h); c.stroke();
  c.font='500 9.5px ui-monospace, monospace'; c.fillStyle='#7A8894';
  c.fillText('따뜻함 HCQ →', pad, H-10);
  c.save(); c.translate(13,pad+h); c.rotate(-Math.PI/2); c.fillText('희귀함 RQ →',0,0); c.restore();
  if(rq!==null){
    const x=pad+w*(hcq/100), y=pad+h*(1-rq/100);
    c.beginPath(); c.arc(x,y,13,0,7); c.fillStyle='rgba(224,169,59,.14)'; c.fill();
    c.beginPath(); c.arc(x,y,5,0,7); c.fillStyle='#E0A93B'; c.fill();
    c.strokeStyle='#07090B'; c.lineWidth=1.5; c.stroke();
    c.font='700 10px ui-monospace, monospace'; c.fillStyle='#E0A93B';
    c.fillText('당신', Math.min(x+11, W-34), y+4);
  }
}

/* ── 공유 카드 (1080×1350) ──
   배경은 파일 안에 들어 있다. 외부 요청이 없으니 어디에 올려도 똑같이 나온다. */
/* 카드 배경은 유형마다 다르다. 여섯 장을 전부 파일 안에 넣을 수는 없으니
   같은 서버에서 받아 온다. 결과 화면이 뜨는 순간 미리 받아 두기 때문에
   공유 버튼을 누를 때는 이미 브라우저에 들어와 있다. */
const _bgs = {};
function bg(id){
  if(_bgs[id]) return _bgs[id];
  _bgs[id] = new Promise(res=>{
    const i = new Image();
    i.onload  = () => res(i);
    i.onerror = () => res(null);     // 못 받아도 카드는 나온다
    i.src = 'cards/card-' + id + '.jpg';
  });
  return _bgs[id];
}
async function makeCard(res){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080,H=1350, cv=document.createElement('canvas');
  cv.width=W; cv.height=H; const c=cv.getContext('2d');
  c.fillStyle='#07090B'; c.fillRect(0,0,W,H);
  const img = await bg(res.t.id);
  if(img) c.drawImage(img,0,0,W,H);
  /* 글자가 놓일 가운데를 눌러 둔다. 구릿빛·초록처럼 밝은 배경에서도
     본문이 읽혀야 하므로 꽤 세게 깐다. */
  const v=c.createRadialGradient(W/2,H*.40,0,W/2,H*.40,W*.82);
  v.addColorStop(0,'rgba(7,9,11,.86)'); v.addColorStop(.55,'rgba(7,9,11,.62)');
  v.addColorStop(1,'rgba(7,9,11,.12)');
  c.fillStyle=v; c.fillRect(0,0,W,H);
  c.textAlign='center';
  c.font='500 22px ui-monospace, monospace'; c.fillStyle='#7A8894';
  c.fillText('C O N S C I E N C E   C O O R D I N A T E S', W/2, 136);
  let ts=112;
  do{ c.font=`800 ${ts}px "Nanum Myeongjo", serif`; ts-=4; }
  while(c.measureText(res.t.ko).width > W-260 && ts>56);
  c.fillStyle = res.t.c;
  c.fillText(res.t.ko, W/2, 296);
  c.font='500 26px ui-monospace, monospace'; c.fillStyle='#7A8894';
  c.fillText(res.t.en.toUpperCase(), W/2, 352);

  /* 유형 설명 — 줄바꿈 */
  c.font='300 30px "Noto Sans KR", sans-serif'; c.fillStyle='#8A99A6';
  let ln='', y=424;
  res.t.line.split(' ').forEach(word=>{
    if(c.measureText(ln+word).width > W-260){ c.fillText(ln,W/2,y); y+=46; ln=''; }
    ln += word+' ';
  });
  c.fillText(ln,W/2,y);

  /* 두 축 */
  const box=(x,label,val,col)=>{
    c.fillStyle='rgba(7,9,11,.68)'; c.fillRect(x,566,420,186);
    c.strokeStyle='rgba(185,198,212,.28)'; c.lineWidth=2; c.strokeRect(x,566,420,186);
    c.textAlign='center';
    c.font='500 22px ui-monospace, monospace'; c.fillStyle='#7A8894';
    c.fillText(label, x+210, 614);
    c.font='700 104px ui-monospace, monospace'; c.fillStyle=col;
    c.fillText(val, x+210, 718);
  };
  box(70,'HCQ · 따뜻함', String(res.hcq), '#E0A93B');
  box(590,'RQ · 희귀함', res.rq===null?'—':String(res.rq), '#A99AF8');

  /* 희귀 문장 */
  c.textAlign='center';
  if(res.rq!==null && res.twin!==null){
    c.fillStyle='rgba(7,9,11,.76)'; c.fillRect(70,812,940,180);
    c.strokeStyle='rgba(142,123,245,.34)'; c.lineWidth=2; c.strokeRect(70,812,940,180);
    c.font='700 40px "Nanum Myeongjo", serif'; c.fillStyle='#A99AF8';
    c.fillText(`${res.N.toLocaleString()}명 중`, W/2, 882);
    c.fillText(`나와 똑같이 답한 사람 ${res.twin}명`, W/2, 938);
  }else{
    c.font='300 30px "Noto Sans KR", sans-serif'; c.fillStyle='#7A8894';
    c.fillText(`지금까지 ${res.N.toLocaleString()}명이 기록을 남겼습니다`, W/2, 896);
  }

  /* 아래쪽 글로우 위에 글자가 놓이므로 어둠을 한 겹 깐다 */
  const sc=c.createLinearGradient(0,1000,0,H);
  sc.addColorStop(0,'rgba(7,9,11,0)'); sc.addColorStop(.45,'rgba(7,9,11,.82)'); sc.addColorStop(1,'rgba(7,9,11,.94)');
  c.fillStyle=sc; c.fillRect(0,1000,W,H-1000);

  if(res.rq!==null && res.twin!==null && res.sameChoice>res.twin){
    c.font='300 27px "Noto Sans KR", sans-serif'; c.fillStyle='#8A99A6';
    c.fillText(`같은 선택을 한 사람은 ${res.sameChoice}명.`, W/2, 1066);
    c.fillText(`같은 이유로 그렇게 한 사람은 ${res.twin}명.`, W/2, 1106);
  }
  c.font='400 31px "Nanum Myeongjo", serif'; c.fillStyle='#A5B2BC';
  c.fillText('이 기록은 언젠가', W/2, 1186);
  c.fillText('기계에 심을 윤리 데이터가 됩니다', W/2, 1230);
  c.font='500 21px ui-monospace, monospace'; c.fillStyle='#7A8894';
  c.fillText(location.host || '양심 좌표', W/2, 1292);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
}

      </div>`:`<div class="waiting">희귀함은 30명이 모이면 계산됩니다.<br>지금까지 ${N.toLocaleString()}명이 기록을 남겼습니다.</div>`}

      <div class="acts">

      ${(S.saved && !S.saved.ok) ? `<div class="warn">

      <div class="foot">
        <p>지금 만들어지는 기계들은 우리가 남긴 글을 읽고 판단을 배웁니다.
        인류가 어디에서 갈라지는지는 아직 어디에도 적혀 있지 않습니다.</p>
        <p class="p2">여기 쌓이는 기록은 언젠가 그 기계에 심을 윤리 데이터가 됩니다.
        AI가 불러온 불안에, 우리는 답이 아니라 기록으로 맞섭니다.
        한 사람의 한 번이 그 시작입니다.</p>
        <div class="fine">RECORDED / ${N.toLocaleString()}</div>
      </div>
    </div>`;

  bg(t.id);          // 공유 버튼을 누르기 전에 미리 받아 둔다
  drawMap($('#cv'),hcq,rq);
  if(!renderResult._rz){ renderResult._rz=true;
    addEventListener('resize',()=>{ const cv=$('#cv'); if(cv&&S.last) drawMap(cv,S.last.hcq,S.last.rq); },{passive:true}); }

  $('#again').onclick = ()=>{ S.i=0; S.stage=0; S.g=null; S.picks=[];
    document.body.classList.remove('go'); boot(); scrollTo({top:0,behavior:'smooth'}); };
  $('#copy').onclick  = ()=> copyText(shareText(res));
  $('#share').onclick = async e=>{
    const b=e.currentTarget; b.disabled=true; b.textContent='카드 만드는 중…';
    try{
      const blob = await makeCard(res);
      const file = new File([blob],'양심좌표.jpg',{type:'image/jpeg'});
      if(navigator.canShare?.({files:[file]})){
        await navigator.share({files:[file], text:shareText(res)});
      }else if(await saveFile(blob,'양심좌표.jpg')){
        toast('카드를 저장했습니다');
      }else{
        await copyText(shareText(res));
        toast('이미지 저장이 막혀 있어 문장으로 복사했습니다');
      }
    }catch(err){ if(err?.name!=='AbortError') toast('공유가 막혀 있습니다. 문장 복사를 써주세요'); }
    b.disabled=false; b.textContent='결과 카드 공유하기';
  };
}

/* 저장 경로가 환경마다 다르다. 되는 것부터 차례로 시도하고, 다 막히면 false. */
async function saveFile(blob, name){
  try{
    if(typeof claude!=='undefined' && claude.use){
      const d = await claude.use('downloads');
      if(d){ await d.save({filename:name, data:blob}); return true; }
    }
  }catch(e){ return false; }
  try{
    const u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    return true;
  }catch(e){ return false; }
}

function shareText(r){
  return `나의 양심 좌표: ${r.t.ko} (${r.t.en})\n따뜻함 ${r.hcq}`
    + (r.rq!==null&&r.twin!==null?` · 희귀함 ${r.rq}\n${r.N.toLocaleString()}명 중 나와 똑같이 답한 사람 ${r.twin}명`:'')
    + `\n\n다섯 개의 답 없는 질문. 당신은 어디에 서 있습니까.\n${location.href}`;
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('복사했습니다'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('복사했습니다'); }catch(_){ toast('복사가 막혀 있습니다'); }
    ta.remove(); }
}

async function finish(){
  const pre = score();
  const mine = path();
  S.saved = await Store.save({path:mine, hcq:pre.hcq, type:pre.t.id});
  S.stats = await Store.fetchAll(mine);
  $('#nCount').textContent = (S.stats.n||0).toLocaleString();
  renderResult();
  scrollTo({top:0,behavior:'smooth'});
}
async function boot(){
  S.stats = await Store.fetchAll(null);
  $('#nCount').textContent = (S.stats.n||0).toLocaleString();
  renderQ();
}
boot();
</script>
